name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bar_ref:
        description: "Ref de PersonalBar a validar (rama, tag o SHA)"
        required: false
        default: main
      identity_ref:
        description: "Ref de PersonalHostel-Server a validar (rama, tag o SHA)"
        required: false
        default: main

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Checkout Bar contract fixtures
        uses: actions/checkout@v4
        with:
          repository: jaminsmoke/PersonalBar
          ref: ${{ inputs.bar_ref || 'main' }}
          path: .family/bar
          sparse-checkout: |
            docs/contrato/fixtures
          sparse-checkout-cone-mode: false

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

  assemble:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-comander-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  family-contracts:
    name: Family contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Identity spec
        uses: actions/checkout@v4
        with:
          repository: jaminsmoke/PersonalHostel-Server
          ref: ${{ inputs.identity_ref || 'main' }}
          path: .family/identity
          sparse-checkout: |
            docs/openapi-camareros.json
            docs/openapi-negocio.json
          sparse-checkout-cone-mode: false

      - name: Checkout Bar LAN module
        uses: actions/checkout@v4
        with:
          repository: jaminsmoke/PersonalBar
          ref: ${{ inputs.bar_ref || 'main' }}
          path: .family/bar
          sparse-checkout: |
            app/src/main/java/com/jaminsmoke/personalbar/lan/BarLanModule.kt
            docs/contrato/openapi-lan.json
            docs/contrato/fixtures
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test contract checker
        run: python scripts/check_family_contracts.py --selftest

      - name: Check Commander paths against Identity and Bar
        run: >
          python scripts/check_family_contracts.py
          --identity-openapi .family/identity/docs/openapi-camareros.json
          --negocio-openapi .family/identity/docs/openapi-negocio.json
          --bar-module .family/bar/app/src/main/java/com/jaminsmoke/personalbar/lan/BarLanModule.kt
          --bar-openapi .family/bar/docs/contrato/openapi-lan.json
