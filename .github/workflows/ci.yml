name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bar_ref:
        description: "Ref de PersonalBar a validar (rama, tag o SHA)"
        required: false
        default: main
      identity_ref:
        description: "Ref de PersonalHostel-Server a validar (rama, tag o SHA)"
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.6.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.6.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Checkout Bar contract fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.5
        with:
          repository: jaminsmoke/PersonalBar
          ref: ${{ inputs.bar_ref || 'main' }}
          path: .family/bar
          persist-credentials: false
          sparse-checkout: |
            docs/contrato/fixtures
          sparse-checkout-cone-mode: false

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

  assemble:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.6.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Generate SBOM (CycloneDX)
        run: ./gradlew cyclonedxBom --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.4
        with:
          name: personal-comander-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.4
        with:
          name: personal-comander-sbom
          path: app/build/reports/cyclonedx/bom.json
          if-no-files-found: error

  instrumented-tests:
    name: Instrumented tests (GMD)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.6.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM group perms
        # En los runners Ubuntu de GitHub el dispositivo /dev/kvm existe pero el
        # usuario runner no tiene acceso por defecto; sin esto el emulador x86_64
        # no arranca ("requires hardware acceleration").
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests (Room, UI y voz-parser)
        run: ./gradlew pixel2api35DebugAndroidTest --no-daemon

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests
          if-no-files-found: warn

  dependency-submission:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Necesario para subir el dependency graph de Gradle a GitHub (solo escritura de contents).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/dependency-submission@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.6.0

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # pull-requests: write para poder comentar hallazgos en el PR; el resto en read.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.5
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  workflow-security:
    name: Workflow security (actionlint + zizmor + policy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.29.0@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.5
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        run: docker run --rm --volume "$PWD:/repo:ro" --workdir /repo "$ACTIONLINT_IMAGE"

      - name: Audit workflow security
        # Solo falla con hallazgos high; los medium/low/info son advisory y se
        # documentan en el item kanban (postura de familia Server/Bar).
        run: docker run --rm --volume "$PWD:/repo:ro" --workdir /repo "$ZIZMOR_IMAGE" --persona=auditor --min-severity high .github/workflows

      - name: Check CI baseline policy
        run: python scripts/check_ci_policy.py

  family-contracts:
    name: Family contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.5
        with:
          persist-credentials: false

      - name: Checkout Identity OpenAPI specs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.5
        with:
          repository: jaminsmoke/PersonalHostel-Server
          ref: ${{ inputs.identity_ref || 'main' }}
          path: .family/identity
          persist-credentials: false
          sparse-checkout: |
            docs/openapi-camareros.json
            docs/openapi-negocio.json
          sparse-checkout-cone-mode: false

      - name: Checkout Bar LAN module and contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.5
        with:
          repository: jaminsmoke/PersonalBar
          ref: ${{ inputs.bar_ref || 'main' }}
          path: .family/bar
          persist-credentials: false
          sparse-checkout: |
            app/src/main/java/com/jaminsmoke/personalbar/lan/BarLanModule.kt
            docs/contrato/openapi-lan.json
            docs/contrato/fixtures
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Self-test contract checker
        run: python scripts/check_family_contracts.py --selftest

      - name: Check Commander paths against Identity and Bar
        run: >
          python scripts/check_family_contracts.py
          --identity-openapi .family/identity/docs/openapi-camareros.json
          --negocio-openapi .family/identity/docs/openapi-negocio.json
          --bar-module .family/bar/app/src/main/java/com/jaminsmoke/personalbar/lan/BarLanModule.kt
          --bar-openapi .family/bar/docs/contrato/openapi-lan.json
