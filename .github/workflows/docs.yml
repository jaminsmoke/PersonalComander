name: docs

on:
  push:
    branches:
      - main
    paths:
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "docs/**"
      - "scripts/check_docs_links.py"
      - "scripts/check_docs_structure.py"
      - "scripts/check_docs_cobertura.py"
      - "scripts/check_docs_shots.py"
      - "README.md"
      - "README.es.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    # Escrito solo en el job que publica (mkdocs gh-deploy escribe en Pages).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Set cache ID
        run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Check local links and assets
        run: python scripts/check_docs_links.py

      - name: Check documentation structure
        run: |
          python scripts/check_docs_structure.py --selftest
          python scripts/check_docs_structure.py

      - name: Check documentation coverage
        run: |
          python scripts/check_docs_cobertura.py --selftest
          python scripts/check_docs_cobertura.py

      - name: Validate documentation
        run: mkdocs build --strict --site-dir site

      - name: Check rendered screenshots
        run: |
          python scripts/check_docs_shots.py --selftest
          python scripts/check_docs_shots.py --site-dir site

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
