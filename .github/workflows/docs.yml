name: docs

on:
  push:
    branches:
      - main
    paths:
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "docs/**"
      - "scripts/check_docs_links.py"
      - "scripts/check_docs_structure.py"
      - "scripts/check_docs_cobertura.py"
      - "README.md"
      - "README.es.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set cache ID
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Check local links and assets
        run: python scripts/check_docs_links.py

      - name: Check documentation structure
        run: |
          python scripts/check_docs_structure.py --selftest
          python scripts/check_docs_structure.py

      - name: Check documentation coverage
        run: |
          python scripts/check_docs_cobertura.py --selftest
          python scripts/check_docs_cobertura.py

      - name: Validate documentation
        run: mkdocs build --strict --site-dir site

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
