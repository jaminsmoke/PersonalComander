name: docs-check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.5
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Check local links and assets
        run: python scripts/check_docs_links.py

      - name: Check documentation structure
        run: |
          python scripts/check_docs_structure.py --selftest
          python scripts/check_docs_structure.py

      - name: Check documentation coverage
        run: |
          python scripts/check_docs_cobertura.py --selftest
          python scripts/check_docs_cobertura.py

      - name: Build MkDocs strictly
        run: mkdocs build --strict --site-dir site

      - name: Check rendered screenshots
        run: |
          python scripts/check_docs_shots.py --selftest
          python scripts/check_docs_shots.py --site-dir site

      - name: Upload documentation preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.4
        with:
          name: docs-site-preview
          path: site
          if-no-files-found: error
